# XcodeGen manifest for the signed MacsPane.app. Regenerate the (git-ignored) .xcodeproj with:
#   xcodegen generate
# The app reuses the package's MacsPaneKit library, so `swift run macspane` and the .app share every line.
name: MacsPane
options:
  bundleIdPrefix: com.jgray
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  MacsPane:
    path: .

targets:
  MacsPane:
    type: application
    platform: macOS
    sources:
      - path: App
        # Xcode builds the icon from AppIcon.icon; the .icns is for the SwiftPM-built bundle.
        excludes: ["AppIcon.icns", "AppIcon.icon"]
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MacsPane
        product: MacsPaneKit
    settings:
      base:
        PRODUCT_NAME: MacsPane
        PRODUCT_BUNDLE_IDENTIFIER: com.jgray.macspane
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES            # menu-bar only, no Dock icon
        INFOPLIST_KEY_CFBundleDisplayName: "MacsPane"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MacsPane:
    build:
      targets:
        MacsPane: all
    run:
      config: Debug
